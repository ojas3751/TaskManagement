# Java の整形規則（#103）。Spotless の eclipse() が読む。
#
# **なぜ Eclipse の整形器なのか。**
# 最初は palantirJavaFormat を使おうとしたが、JDK 25 上で NoSuchMethodError になる
# （javac の内部 API に依存しており、getDiagnostics の戻り値の型が変わったため）。
# 2.68.0 まで上げても同じで、googleJavaFormat も同じ理由で動かない。この環境には
# JDK 25 しか入っていないため、古い JDK へ逃がすこともできない。
# Eclipse の整形器は javac の内部を使わないので、JDK の版に左右されない。
#
# 値は既存コードの書き方に合わせてある。整形の導入で既存ファイルが丸ごと
# 書き換わらないようにするため。

# インデントは4スペース（既存コードと同じ）
org.eclipse.jdt.core.formatter.tabulation.char=space
org.eclipse.jdt.core.formatter.tabulation.size=4
org.eclipse.jdt.core.formatter.indentation.size=4
org.eclipse.jdt.core.formatter.continuation_indentation=2
org.eclipse.jdt.core.formatter.continuation_indentation_for_array_initializer=2

# 1行の上限は120桁。既存の最長は111桁（TaskList.java）
org.eclipse.jdt.core.formatter.lineSplit=120

# **コメントは整形しない。**
# このリポジトリの Javadoc は、<p> や <strong> を使って日本語で理由を書いた長い文章で、
# 改行の位置に意味がある。整形器に任せると全ファイルのコメントが組み直され、
# 差分がコメントだけで埋まる。
org.eclipse.jdt.core.formatter.comment.format_javadoc_comments=false
org.eclipse.jdt.core.formatter.comment.format_block_comments=false
org.eclipse.jdt.core.formatter.comment.format_line_comments=false
org.eclipse.jdt.core.formatter.comment.format_header=false

# 既に折り返してある行を1行にまとめ直さない。引数の並べ方は書き手の判断に任せる
org.eclipse.jdt.core.formatter.join_wrapped_lines=false
org.eclipse.jdt.core.formatter.join_lines_in_comments=false

# 空行の扱い。既存の書き方（メンバの間に1行）を保つ
org.eclipse.jdt.core.formatter.number_of_empty_lines_to_preserve=1
org.eclipse.jdt.core.formatter.blank_lines_before_method=1
org.eclipse.jdt.core.formatter.blank_lines_before_field=0
