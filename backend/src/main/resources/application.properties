spring.application.name=taskmanagement

# ポートは 8080 に固定する（CLAUDE.md「起動ポート」）。
# Spring Boot の既定値と同じだが、frontend/vite.config.ts の proxy 先が
# この番号を直接指しているため、既定に任せず明示しておく。
# 埋まっている場合は別ポートへ逃がさず、占有側を止めること。
server.port=8080

# 接続情報はリポジトリにコミットしない（docs/requirements.md「機密情報の管理」）。
# 環境変数で渡す。設定手順は docs/operations.md「初回セットアップ」を参照。
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# スキーマを作るのは Flyway の役目。Hibernate には作らせず、
# エンティティとの食い違いを起動時に検出させるだけにする。
# 詳細は docs/design/database.md「スキーマの管理」を参照。
spring.jpa.hibernate.ddl-auto=validate

# JSON のキーは snake_case（docs/design/api.md「JSON の約束事」）。
spring.jackson.property-naming-strategy=SNAKE_CASE

# 日時は ISO 8601 のオフセット付きで返す（docs/design/api.md「日時の形式」）。
# 指定しないと Jackson は UTC に正規化して "2026-08-21T15:00:00Z" のように返す。
# 値としては同じ瞬間だが、設計書が定めた "2026-08-22T00:00:00+09:00" の形と違ってしまう。
spring.jackson.time-zone=Asia/Tokyo

# ORM が発行する SQL をログに出す（docs/requirements.md「発行SQLの可視化」）。
# spring.jpa.show-sql は標準出力に垂れ流すだけでバインド値が見えないため使わない。
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE
