# test プロファイルでの上書き。main 側の application.properties に足す形で読まれる。
#
# ファイル名を application.properties にしてはならない。クラスパス上で main 側を
# 丸ごと覆い隠してしまい、SNAKE_CASE や日時の形式といった API の約束事が消える
# （実際にそれで list_id が読めず、全テストが 400 になった）。
#
# 接続先は PostgresContainerConfig の @ServiceConnection が最終的に差し替えるため、
# ここの値は使われない。それでも書いておくのは、main 側が ${DB_URL} という環境変数の
# 参照になっており、.env を読まないテスト実行では解決に失敗するため。
spring.datasource.url=jdbc:postgresql://localhost:5432/placeholder
spring.datasource.username=placeholder
spring.datasource.password=placeholder

# 発行 SQL のログは開発時に見るためのもの。テストでは出力が埋もれるだけなので落とす。
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.orm.jdbc.bind=WARN
