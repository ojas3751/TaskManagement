# =============================================================================
# nginx の設定（EC2 の /etc/nginx/nginx.conf になる）
# =============================================================================
#
# 1つの住所（http://EC2 の IP/）で、画面と API の両方を出す:
#   /api/ で始まる住所 → API（同じサーバーの 127.0.0.1:8080 で動く Spring Boot）に中継する
#   それ以外           → 画面のファイル（PC でビルドした frontend/dist）をそのまま返す
#
# PC で開発するときは、Vite が同じように /api を 8080 に中継している（frontend/vite.config.ts）。
# 画面からも API からも「同じ住所」に見えるので、アプリのコードは変えなくてよい。

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log notice;
pid /run/nginx.pid;

include /usr/share/nginx/modules/*.conf;

events {
    worker_connections 1024;
}

http {
    include      /etc/nginx/mime.types;
    default_type application/octet-stream;
    # ファイルの種類の一覧（mime.types）を読むための表の大きさ。Amazon Linux の標準の設定と同じ値
    types_hash_max_size 4096;
    access_log   /var/log/nginx/access.log;
    sendfile     on;

    # エラーのページなどに nginx の版を出さない
    server_tokens off;

    # 文字のファイルは圧縮して送る（画面の読み込みが速くなる）
    gzip       on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    server {
        listen 80 default_server;

        # 画面のファイルの置き場。deploy.sh がここを入れ替える
        root  /usr/share/nginx/taskmgmt;
        index index.html;

        # API への中継
        location /api/ {
            proxy_pass         http://127.0.0.1:8080;
            proxy_set_header   Host $host;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 60s;
        }

        # ビルドで名前に中身の指紋が付くファイル（例: index-Bz2cV1Bi.css）。
        # 中身が変われば名前も変わるので、ブラウザに長く覚えさせてよい
        location /assets/ {
            add_header Cache-Control "public, max-age=31536000, immutable";
            try_files  $uri =404;
        }

        # それ以外は画面。ファイルが無い住所でも index.html を返す
        # （画面の中で住所を切り替える作りになっても、直接開いたときに表示できるように）。
        # index.html は毎回確かめさせ、入れ替えた新しい画面がすぐ使われるようにする
        location / {
            add_header Cache-Control "no-cache";
            try_files  $uri $uri/ /index.html;
        }
    }
}
